name: Canary Release

on:
  push:
    branches: [canary]

permissions:
  contents: write
  id-token: write

concurrency:
  group: canary-${{ github.ref }}
  cancel-in-progress: true

jobs:
  canary:
    name: Publish canary snapshot
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "pnpm"
          registry-url: "https://registry.npmjs.org"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Build
        run: pnpm build

      - name: Version as canary snapshot
        run: pnpm changeset version --snapshot canary

      - name: Publish canary
        run: pnpm changeset publish --tag canary --no-git-tag
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
